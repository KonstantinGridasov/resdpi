plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.gkreduction.resdpi'
    compileSdk = 35
    resourcePrefix = "lib_"
    defaultConfig {
        minSdk = 24
    }

    buildTypes {
        release {
        }
    }
}

dependencies {
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
//                from components.release
                groupId = 'com.github.KonstantinGridasov'
                artifactId = 'resdpi'
                version = '2.0.0'
            }
        }
    }
}